name: Research evidence integrity

on:
  push:
    branches:
      - main
      - audit/english-apache-repro-fix
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research archive
        uses: actions/checkout@v5
      - name: Check Python syntax
        run: python3 -m compileall -q research/p2 scripts tests
      - name: Verify archived artifact hashes
        run: python3 scripts/verify_evidence.py
      - name: Reaggregate archived Qwen results
        run: python3 scripts/summarize_qwen.py
      - name: Check standalone book JavaScript syntax
        run: |
          python3 -c "from pathlib import Path; h=Path('docs/index.html').read_text(encoding='utf-8'); Path('/tmp/metis-book.js').write_text(h.split('<script>',1)[1].split('</script>',1)[0], encoding='utf-8')"
          node --check /tmp/metis-book.js
      - name: Run offline tests
        run: python3 -m unittest discover -s tests -v
